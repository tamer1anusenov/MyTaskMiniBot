<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Task</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <div class="flex flex-col h-screen bg-background font-sans text-foreground">
      <header class="flex items-center justify-between px-4 py-3 border-b border-border/30">
        <button
          id="cancel-btn"
          class="text-primary text-[17px] font-medium transition-colors active:opacity-60"
        >
          Cancel
        </button>
        <h1 class="text-[17px] font-semibold font-heading">New Task</h1>
        <button
          id="save-btn"
          class="text-primary text-[17px] font-semibold transition-colors active:opacity-60"
        >
          Add
        </button>
      </header>
      <main class="flex-1 flex flex-col pt-4">
        <div class="px-4 mb-4">
          <textarea
            id="task-input"
            placeholder="What needs to be done?"
            class="w-full bg-transparent border-none outline-none text-[20px] leading-snug resize-none h-24 placeholder:text-muted-foreground focus:ring-0"
            autofocus
          ></textarea>
          <p class="text-[13px] text-muted-foreground mt-1">
            Try "tomorrow 3pm" or "!high"
          </p>
        </div>
        <div class="mt-auto pb-6 border-t border-border/10">
          <div class="flex items-center gap-3 px-4 py-3 border-b border-border/30">
            <iconify-icon
              icon="solar:flag-2-bold"
              class="text-muted-foreground"
              width="20"
              height="20"
            ></iconify-icon>
            <div class="flex-1 flex gap-2">
              <button
                id="priority-low"
                class="px-3 py-1.5 rounded-lg bg-secondary text-[14px] font-medium border border-chart-2/20 text-chart-2"
              >
                Low</button
              ><button
                id="priority-medium"
                class="px-3 py-1.5 rounded-lg bg-secondary text-[14px] font-medium border border-chart-3/20 text-chart-3"
              >
                Medium</button
              ><button
                id="priority-high"
                class="px-3 py-1.5 rounded-lg bg-accent text-[14px] font-semibold border-2 border-chart-4/50 text-chart-4"
              >
                High
              </button>
            </div>
          </div>
          <div
            id="datetime-section"
            class="flex items-center justify-between px-4 py-3 border-b border-border/30 active:bg-secondary/50 transition-colors"
          >
            <div class="flex items-center gap-3">
              <iconify-icon
                icon="solar:calendar-date-bold"
                class="text-muted-foreground"
                width="20"
                height="20"
              ></iconify-icon
              ><span class="text-[17px]">Set Date &amp; Time</span>
            </div>
            <span id="datetime-display" class="text-muted-foreground text-[15px]">
              Tomorrow, 15:00
            </span>
          </div>
          <div
            id="tags-section"
            class="flex items-center gap-3 px-4 py-3 border-b border-border/30"
          >
            <iconify-icon
              icon="solar:tag-bold"
              class="text-muted-foreground"
              width="20"
              height="20"
            ></iconify-icon>
          </div>
        </div>
      </main>
    </div>
    <script src="/static/js/telegram-webapp.js" defer></script>
    <script src="/static/js/main.js" defer></script>
  </body>
</html>
